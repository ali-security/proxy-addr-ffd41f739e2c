name: CI workflow
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tap test file(s) to run instead of the full suite'
        required: false
        default: ''
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install Dependencies
      run: npm install --ignore-scripts
    - name: Test
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          npx tap ${{ inputs.test-filter }}
        else
          npm test
        fi

  pack:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 14.15.4
      uses: actions/setup-node@v4
      with:
        node-version: 14.15.4
    - name: Pack
      run: |
        npm i -g npm@6.14.11
        npm pack
        mkdir -p dist
        mv fastify-proxy-addr-3.0.0.tgz dist/proxy-addr-3.0.0.tgz
    - uses: actions/upload-artifact@v4
      with:
        name: proxy-addr-tgz
        path: dist/proxy-addr-3.0.0.tgz
        if-no-files-found: error
